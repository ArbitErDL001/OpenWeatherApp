<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.2/feather.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <div class="search-row">
      <input id="city-input" type="text" placeholder="Enter a city..." value="Manila" aria-label="City name">
      <button id="search-button" type="button" aria-label="Search city"><i data-feather="search"></i></button>
    </div>

    <section class="container">
      <div class="weather-side">
        <div class="weather-gradient"></div>
        <div class="date-container">
          <h2 class="date-dayname" id="day-name">Tuesday</h2>
          <span class="date-day" id="date-day">15 Jan 2019</span>
          <div class="location-line">
            <i class="location-icon" data-feather="map-pin"></i>
            <span class="location" id="location">Manila, PH</span>
          </div>
        </div>
        <div class="weather-container">
          <i class="weather-icon" id="weather-icon" data-feather="sun"></i>
          <h1 class="weather-temp" id="weather-temp">--°C</h1>
          <h3 class="weather-desc" id="weather-desc">Loading...</h3>
        </div>
      </div>

      <div class="info-side">
        <div class="today-info-container">
          <div class="today-info">
            <div class="precipitation">
              <span class="title">PRECIPITATION</span>
              <span class="value" id="precipitation">-- %</span>
              <div class="clear"></div>
            </div>
            <div class="humidity">
              <span class="title">HUMIDITY</span>
              <span class="value" id="humidity">-- %</span>
              <div class="clear"></div>
            </div>
            <div class="wind">
              <span class="title">WIND</span>
              <span class="value" id="wind">-- km/h</span>
              <div class="clear"></div>
            </div>
          </div>
        </div>

        <div class="week-container">
          <ul class="week-list" id="week-list">
            <li class="forecast-loading">Loading forecast...</li>
          </ul>
        </div>

        <div class="location-container">
          <button class="location-button" id="change-location" type="button">
            <i data-feather="map-pin"></i>
            <span>Change location</span>
          </button>
        </div>
        <div class="unit-row">
          <button id="unit-toggle" type="button">Switch to °F</button>
          <span id="status" aria-live="polite">Weather by OpenWeather</span>
        </div>
      </div>
    </section>
    <p class="error-message" id="error-message" role="alert"></p>
    <footer>Weather data by <a href="https://openweathermap.org/" target="_blank" rel="noreferrer">OpenWeather</a></footer>
  </main>
</body>
</html>
